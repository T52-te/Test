services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      - POSTGRES_USER=taskapp
      - POSTGRES_PASSWORD=taskapp_dev_password
      - POSTGRES_DB=taskapp
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U taskapp -d taskapp']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  web:
    image: node:22
    working_dir: /app
    restart: on-failure
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=postgres://taskapp:taskapp_dev_password@db:5432/taskapp
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
      - NEXT_TELEMETRY_DISABLED=1
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - npm ci --no-audit --no-fund && node scripts/migrate.mjs && exec npm run dev
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 90s

volumes:
  db_data:
  web_node_modules:
